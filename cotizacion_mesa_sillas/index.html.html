<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XKARI · Mapa mental de cotización</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4efe8;color:#2c261f}
  .wrap{max-width:1100px;margin:auto;padding:20px}

  /* HEADER */
  .top{background:#30271f;color:#fff;border-radius:24px;padding:24px;text-align:center}
  .brand{letter-spacing:5px;font-weight:bold}
  .top h1{margin:12px 0 4px;font-size:32px}
  .top p{margin:0;color:#d8cbbb}

  /* MAPA */
  .map{position:relative;min-height:650px;margin-top:20px;background:#fbf9f6;
       border:1px solid #e2d8ca;border-radius:28px;overflow:hidden}

  /* LÍNEAS SVG */
  .lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
  .lines line{stroke:#c9b39e;stroke-width:2;stroke-linecap:round}

  /* CENTRO */
  .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
          width:230px;height:150px;border-radius:30px;
          background:linear-gradient(145deg,#6d482f,#9b6c48);
          color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
          text-align:center;box-shadow:0 18px 40px #0003;z-index:3;padding:12px}
  .center strong{font-size:24px}
  .center span{margin-top:8px;font-size:13px;color:#eadfd4;line-height:1.3}

  /* NODOS */
  .node{position:absolute;width:190px;min-height:105px;background:#fff;
        border:1px solid #dfd4c6;border-radius:20px;padding:16px;text-align:center;
        box-shadow:0 10px 24px #00000010;cursor:pointer;transition:.2s;z-index:2;
        font-family:inherit;color:inherit;outline:none}
  .node:hover,.node:focus-visible{transform:scale(1.04);box-shadow:0 14px 30px #0002;
        border-color:#9b6c48}
  .node b{display:block;font-size:17px;margin-bottom:6px}
  .node small{color:#786f65;line-height:1.35;display:block}

  /* Nodo con foto de fondo */
  .node.foto{background-size:cover;background-position:center;color:#fff;position:relative}
  .node.foto::before{content:"";position:absolute;inset:0;border-radius:20px;
        background:linear-gradient(180deg,#0008,#000b)}
  .node.foto b,.node.foto small{position:relative;z-index:1;color:#fff}

  /* POSICIONES */
  .n1{left:5%;top:28%}
  .n2{right:5%;top:28%}
  .n3{left:4%;top:7%}
  .n4{right:4%;top:7%}
  .n5{left:13%;bottom:7%}
  .n6{right:13%;bottom:7%}

  /* PRODUCTOS PRINCIPALES */
  .producto{min-height:145px;width:215px}
  .producto b{font-size:22px}
  .producto small{font-size:13px}

  /* MODAL */
  .modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;
         justify-content:center;padding:20px;z-index:10}
  .modal.open{display:flex}
  .box{background:#fff;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;
       border-radius:24px;padding:26px;position:relative;animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .box h2{margin:0 0 10px;color:#6d482f}
  .box p{line-height:1.6;color:#655e56;margin:0 0 14px}

  #mimg{width:100%;border-radius:16px;margin-bottom:14px;display:none;object-fit:cover}
  #galeria{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  #galeria img{width:70px;height:70px;object-fit:cover;border-radius:10px;cursor:pointer;
        border:2px solid transparent;transition:.15s}
  #galeria img:hover{border-color:#9b6c48;transform:scale(1.05)}
  #galeria img.activa{border-color:#6d482f}

  .close{position:absolute;right:15px;top:12px;border:0;background:#eee;border-radius:50%;
         width:36px;height:36px;font-size:20px;cursor:pointer;line-height:1}
  .close:hover{background:#ddd}

  .note{text-align:center;color:#756c62;font-size:13px;margin:15px}

  /* RESPONSIVE */
  @media(max-width:750px){
    .map{min-height:auto;padding:20px 10px;display:grid;gap:12px;
         grid-template-columns:1fr 1fr}
    .lines{display:none}
    .center{position:static;transform:none;width:100%;height:auto;padding:20px;
            grid-column:1 / -1;margin-bottom:6px}
    .node{position:static;width:100%;min-height:auto}
    .n1,.n2,.n3,.n4,.n5,.n6{left:auto;right:auto;top:auto;bottom:auto}
    .producto{width:100%;min-height:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">XKARI</div>
    <h1>Cotización · Mesa + Sillas</h1>
    <p>Mapa interactivo del proyecto</p>
  </header>

  <div class="map">
    <!-- LÍNEAS SVG (centro 550,325) -->
    <svg class="lines" viewBox="0 0 1100 650" preserveAspectRatio="none">
      <line x1="550" y1="325" x2="150" y2="275"/>
      <line x1="550" y1="325" x2="950" y2="275"/>
      <line x1="550" y1="325" x2="139" y2="110"/>
      <line x1="550" y1="325" x2="961" y2="110"/>
      <line x1="550" y1="325" x2="238" y2="550"/>
      <line x1="550" y1="325" x2="862" y2="550"/>
    </svg>

    <div class="center">
      <strong>MESA + SILLAS</strong>
      <span>Proyecto personalizado<br>Selecciona mesa, sillas o información adicional</span>
    </div>

    <!-- PRODUCTOS PRINCIPALES E INFORMACIÓN ADICIONAL -->

    <button class="node producto n1" type="button"
  onclick="show('Mesa','Fotografías de la mesa propuesta.<br><br>puede escoger un modelo similar',
    '🪵',
    ['fotos/mesa-1.jpg'])">
  <b>🪵 MESA</b>
  <small>Fotos de la mesa<br>Vista, diseño y detalles</small>
</button>

    <button class="node producto n2" type="button"
  onclick="show('Sillas','Fotografías de las sillas propuestas.',
    '🪑',
    ['fotos/silla-1.jpeg','fotos/silla-2.jpeg','fotos/silla-3.jpeg'])">
  <b>🪑 SILLAS</b>
  <small>Fotos de las sillas<br>Vista, diseño y detalles</small>
</button>


    <button class="node n3" type="button"
  onclick="show('Medidas','Mesa: 210 × 110 cm','📐',
    ['fotos/plano.jpeg'])">
  <b>📐 Medidas</b>
  <small>Dimensiones y planos</small>
</button>

    <button class="node n4" type="button"
      onclick="show('Madera','Parota seleccionada para el proyecto.<br>Podemos mostrar fotografías de la madera y sus características.','🪵',
        ['fotos/parota-1.jpg',''])">
      <b>🪵 Madera</b>
      <small>Especie, selección y detalles</small>
    </button>

    <button class="node n5" type="button"
      onclick="show('Acabado','Acabado con poliuretano: tono, brillo y textura.<br>Protección contra humedad y uso diario.','🎨',
        ['fotos/acabado-1.jpg','fotos/acabado-2.jpg'])">
      <b>🎨 Acabado</b>
      <small>Tono, protección y textura</small>
    </button>

    <button class="node n6" type="button"
  onclick="show('Inversión',
    '<b>Mesa + 8 sillas</b><br><br>' +
    '💵 Precio total: <b>$40,000 MXN</b><br>' +
    '🟢 Anticipo (50%): <b>$20,000</b><br>' +
    '🔵 Saldo (50%): <b>$20,000</b>',
    '💰', null)">
  <b>💰 Inversión</b>
  <small>Precio, anticipo y saldo</small>
</button>
  </div>

  <div class="note">Cada nodo puede abrir fotos, planos, especificaciones o información del proyecto.</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <button class="close" type="button" aria-label="Cerrar">×</button>
    <img id="mimg" alt="">
    <div id="galeria"></div>
    <h2 id="mt"></h2>
    <p id="mp"></p>
  </div>
</div>

<script>
  const modal   = document.getElementById('modal');
  const mimg    = document.getElementById('mimg');
  const galeria = document.getElementById('galeria');
  const mt      = document.getElementById('mt');
  const mp      = document.getElementById('mp');

  function show(titulo, texto, icono, imgs){
    mt.textContent = icono + ' ' + titulo;
    mp.innerHTML   = texto;
    galeria.innerHTML = '';
    mimg.style.display = 'none';
    mimg.removeAttribute('src');

    if (Array.isArray(imgs) && imgs.length){
      mimg.src = imgs[0];
      mimg.style.display = 'block';
      mimg.alt = titulo;

      imgs.forEach((src, i) => {
        const im = document.createElement('img');
        im.src = src;
        im.alt = titulo + ' ' + (i+1);
        if (i === 0) im.classList.add('activa');
        im.onclick = () => {
          mimg.src = src;
          galeria.querySelectorAll('img').forEach(x => x.classList.remove('activa'));
          im.classList.add('activa');
        };
        galeria.appendChild(im);
      });
    }

    modal.classList.add('open');
  }

  function closeM(){
    modal.classList.remove('open');
  }

  // Cerrar con clic fuera de la caja o botón ×
  modal.addEventListener('click', e => {
    if (e.target === modal || e.target.closest('.close')) closeM();
  });

  // Cerrar con Esc
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closeM();
  });
</script>
</body>
</html>
